# Secrets scanning in CI — Lab 2.1
#
# This is the control developers CANNOT skip (unlike `git commit --no-verify`).
# Pair it with branch protection: "Require status checks to pass" -> secrets-scan.

name: secrets-scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # nightly full-history scan: new rules find OLD leaks

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # FULL history — shallow clones hide old leaks

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gl.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # Supply-chain hygiene: verify the download against the release checksums.
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" checksums.txt | sed "s/gitleaks_.*_linux_x64.tar.gz/gl.tgz/" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Scan
        id: scan
        run: |
          # PRs: scan only the commits the PR adds (fast, precise).
          # Everything else: scan all history on all branches.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            LOG_OPTS="--all"
          fi
          gitleaks git . \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact \
            --report-format sarif --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
        continue-on-error: true      # Security tab needs GHAS on private repos

      - name: Tell the developer what to do
        if: failure() && steps.scan.outcome == 'failure'
        run: |
          {
            echo "## 🚨 Secret detected"
            echo ""
            echo "1. **Rotate the credential now.** Assume it is compromised."
            echo "2. Remove it from the branch (amend/rebase if not yet merged)."
            echo "3. If it's a false positive, add its fingerprint to \`.gitleaksignore\` with a justification."
            echo ""
            echo "Findings are in the Security tab / the gitleaks.sarif artifact. Values are redacted."
          } >> "$GITHUB_STEP_SUMMARY"
